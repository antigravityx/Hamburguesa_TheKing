<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The King Burger - Carta Menú Web</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>
    <div class="background-overlay"></div>
    
    <header class="header glassmorphism">
        <div class="logo-container">
            <h1 class="brand-title">THE KING <span class="accent">BURGER</span></h1>
            <p class="brand-subtitle">El Sabor de la Corona</p>
        </div>
        <div class="cart-icon" id="cart-toggle">
            <i class="ri-shopping-cart-2-fill"></i>
            <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <!-- Hero Banner Section -->
    <section class="hero" id="hero">
        <div class="hero-glow"></div>
        <div class="hero-embers">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="hero-content">
            <div class="crown-icon">👑</div>
            <h2 class="hero-title">THE KING <span class="hero-accent">BURGER</span></h2>
            <div class="hero-divider"><span></span></div>
            <p class="hero-tagline">El Sabor de la Corona</p>
            <p class="hero-sub">Hamburguesas Artesanales · Pizzas · Delivery Propio</p>
            <div class="hero-info">
                <span><i class="ri-phone-line"></i> 3794-29-9964</span>
                <span><i class="ri-instagram-line"></i> @theking.ctes</span>
            </div>
            <a href="#menu" class="hero-cta">
                <i class="ri-restaurant-2-line"></i> Ver Menú
            </a>
        </div>
    </section>

    <main class="container" id="menu">
        <!-- Categorías / Tabs de navegación -->
        <nav class="categories">
            <button class="category-btn active" data-target="promos">Promociones</button>
            <button class="category-btn" data-target="premium">Hamburguesas Premium</button>
            <button class="category-btn" data-target="clasicas">Hamburguesas Clásicas</button>
            <button class="category-btn" data-target="pizzas">Pizzas</button>
            <button class="category-btn" data-target="papas">Papas Fritas</button>
            <button class="category-btn" data-target="bebidas">Bebidas</button>
        </nav>

        <!-- Contenedor único dinámico para productos -->
        <section id="menu-section" class="menu-section active">
            <h2 class="section-title" id="section-title">Promociones</h2>
            <div class="products-grid" id="products-grid">
                <!-- Se inyecta dinámicamente con JS -->
            </div>
        </section>
    </main>

    <!-- Modal del Carrito -->
    <div class="cart-modal glassmorphism" id="cart-modal">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <button id="close-cart"><i class="ri-close-line"></i></button>
        </div>
        <div class="cart-items" id="cart-items">
            <!-- Items se insertan aquí vía JS -->
            <p class="empty-cart-msg">Tu carrito está vacío</p>
        </div>
        
        <!-- Formulario de Datos para WhatsApp -->
        <div class="checkout-form" id="checkout-form" style="display: none;">
            <input type="text" id="customer-name" placeholder="Tu Nombre y Apellido" required>
            <input type="text" id="customer-address" placeholder="Dirección de Envío" required>
            <select id="payment-method">
                <option value="Efectivo">Pago en Efectivo</option>
                <option value="Transferencia">Transferencia (Alias/CBU)</option>
            </select>
        </div>

        <div class="cart-footer">
            <div class="total">
                <span>Total:</span>
                <span id="cart-total">$0</span>
            </div>
            <button id="checkout-btn" class="checkout-btn">
                <i class="ri-whatsapp-line"></i> Pedir por WhatsApp
            </button>
        </div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="toast glassmorphism">Producto añadido al carrito</div>

    <script src="js/app.js"></script>
</body>
</html>
